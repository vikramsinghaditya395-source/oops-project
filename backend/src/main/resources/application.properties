# VoltFlow Electricity Bill Management System - Application Configuration
server.port=8080

# Spring Application Name
spring.application.name=voltflow-backend

# Database Configuration (Defaults to H2 for instant out-of-the-box demo; uncomment MySQL for production)
spring.datasource.url=jdbc:h2:mem:voltflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Uncomment below for MySQL Database Connection:
# spring.datasource.url=jdbc:mysql://localhost:3306/voltflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=rootpassword

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Spring Mail (Configurable SMTP; falls back to Dev Console Log if credentials not set)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CORS Allowed Origin for React Frontend
voltflow.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Security OTP Policy Settings
voltflow.security.otp.expiry-minutes=5
voltflow.security.otp.max-attempts=5
voltflow.security.otp.resend-cooldown-seconds=60
